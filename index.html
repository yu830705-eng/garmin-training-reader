
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin 訓練數據整理器</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141c;color:#edf2f7;font-family:Arial,"Noto Sans TC",sans-serif;line-height:1.6}
main{max-width:850px;margin:auto;padding:24px 16px 60px}
h1{font-size:27px;margin-bottom:4px}
h2{font-size:19px}
.muted{color:#9ba9bb;font-size:14px}
.panel{background:#1a2230;border:1px solid #303b4d;border-radius:14px;padding:18px;margin:18px 0}
button,.upload{display:inline-block;border:0;border-radius:8px;padding:10px 14px;background:#7dd3fc;color:#102030;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}
.secondary{background:#364256;color:#fff}
.danger{background:#522c35;color:#ffdce1}
input[type=file]{display:none}
textarea,input,select{width:100%;background:#101722;color:#fff;border:1px solid #3b485d;border-radius:8px;padding:10px;margin:6px 0 12px;font:inherit}
textarea{min-height:100px}
.item{padding:14px 0;border-bottom:1px solid #354052}
.item img{display:block;max-width:100%;max-height:220px;margin:10px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101722;padding:14px;border-radius:8px}
.status{color:#7dd3fc;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Garmin 訓練數據整理器</h1>
<p class="muted">上傳截圖、辨識數據、整理成精簡訓練紀錄。</p>

<section class="panel">
<h2>1. 上傳 Garmin 截圖</h2>
<p class="muted">最多 20 張。圖片在瀏覽器中處理，不會由本頁上傳到自建伺服器。</p>
<label class="upload" for="files">選擇圖片</label>
<input id="files" type="file" accept="image/*" multiple>
<span id="count" class="muted">0 / 20 張</span>
<div>
<button id="recognize">開始辨識</button>
<button id="clear" class="secondary">清空</button>
</div>
<p id="status" class="status">等待圖片。</p>
</section>

<section class="panel">
<h2>2. 檢查辨識結果</h2>
<p class="muted">每張圖只保留數據辨識結果。請修正錯誤的數字，並確認單位。</p>
<div id="images"></div>
</section>

<section class="panel">
<h2>3. 精簡報告設定</h2>
<label>運動類型
<select id="sport">
<option value="自動判斷">自動判斷</option>
<option value="自行車">自行車</option>
<option value="跑步">跑步</option>
<option value="游泳">游泳</option>
</select>
</label>
<label>補充說明（選填）
<input id="note" placeholder="例如：Z2 長騎、爬坡間歇、恢復跑">
</label>
<button id="generate">產生精簡報告</button>
<button id="copy" class="secondary">複製報告</button>
<pre id="report">尚未產生報告。</pre>
</section>
<p class="muted">提醒：OCR 可能誤判數字。請以 Garmin 原始畫面為準；重複截圖的相同數據不應累加。</p>
</main>

<script>
const $ = id => document.getElementById(id);
let records = [];
let seq = 0;

$("files").addEventListener("change", e => {
  const files = [...e.target.files];
  const slots = 20 - records.length;
  files.slice(0, Math.max(0, slots)).forEach(file => {
    if (!file.type.startsWith("image/")) return;
    records.push({
      id: ++seq,
      file,
      url: URL.createObjectURL(file),
      name: file.name,
      text: "",
      metrics: {},
      status: "尚未辨識"
    });
  });
  e.target.value = "";
  render();
  if (files.length > slots) alert("最多可上傳 20 張圖片。");
});

function render() {
  $("count").textContent = `${records.length} / 20 張`;
  const root = $("images");
  root.replaceChildren();

  if (!records.length) {
    root.textContent = "尚未加入圖片。";
    return;
  }

  records.forEach(r => {
    const box = document.createElement("div");
    box.className = "item";

    const title = document.createElement("strong");
    title.textContent = r.name;

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = r.status;

    const img = document.createElement("img");
    img.src = r.url;
    img.alt = r.name;

    const label = document.createElement("label");
    label.textContent = "辨識文字（可修改）";

    const area = document.createElement("textarea");
    area.value = r.text;
    area.placeholder = "辨識完成後，重點數據會出現在這裡。";
    area.addEventListener("input", () => {
      r.text = area.value;
      r.metrics = extract(area.value);
    });

    const del = document.createElement("button");
    del.textContent = "刪除此圖";
    del.className = "danger";
    del.addEventListener("click", () => {
      URL.revokeObjectURL(r.url);
      records = records.filter(x => x.id !== r.id);
      render();
    });

    box.append(title, status, img, label, area, del);
    root.append(box);
  });
}

function clean(s) {
  return s.replace(/\s+/g, " ").trim();
}

function extract(text) {
  const t = text.replace(/，/g, ",").replace(/：/g, ":");
  const out = {};

  const rules = [
    ["日期", /(?:日期|date)\s*:?\s*((?:20\d{2})[\/.-]\d{1,2}[\/.-]\d{1,2})/i],
    ["距離", /(?:距離|distance)\s*:?\s*([\d,.]+\s*(?:km|公里|m|公尺|mi|英里))/i],
    ["時間", /(?:總時間|運動時間|時間|duration|time)\s*:?\s*(\d{1,2}:\d{2}(?::\d{2})?)/i],
    ["平均心率", /(?:平均心率|平均心跳|avg\.?\s*hr|平均 HR)\s*:?\s*(\d{2,3})\s*(?:bpm)?/i],
    ["最高心率", /(?:最高心率|最大心率|max\.?\s*hr|最大 HR)\s*:?\s*(\d{2,3})\s*(?:bpm)?/i],
    ["平均功率", /(?:平均功率|平均瓦數|avg\.?\s*power)\s*:?\s*(\d{2,3})\s*(?:w|瓦)?/i],
    ["標準化功率", /(?:標準化功率|normalized power|NP)\s*:?\s*(\d{2,3})\s*(?:w|瓦)?/i],
    ["爬升", /(?:總爬升|爬升高度|總上升|elevation gain|total ascent)\s*:?\s*([\d,]+)\s*(?:m|公尺)?/i],
    ["平均速度", /(?:平均速度|avg\.?\s*speed)\s*:?\s*([\d.]+\s*(?:km\/h|公里\/小時)?)/i],
    ["平均配速", /(?:平均配速|配速|avg\.?\s*pace|pace)\s*:?\s*(\d{1,2}:\d{2}(?:\s*\/\s*(?:km|公里|100\s*m))?)/i],
    ["步頻", /(?:平均步頻|步頻|cadence)\s*:?\s*(\d{2,3})\s*(?:spm|步\/分)?/i],
    ["平均踏頻", /(?:平均踏頻|踏頻|avg\.?\s*cadence)\s*:?\s*(\d{2,3})\s*(?:rpm|轉\/分)?/i],
    ["卡路里", /(?:卡路里|消耗熱量|熱量|calories)\s*:?\s*([\d,]+)\s*(?:kcal|大卡)?/i],
    ["泳池長度", /(?:泳池長度|pool length)\s*:?\s*(25|50)\s*(?:m|公尺)?/i],
    ["游泳趟數", /(?:趟數|lengths)\s*:?\s*(\d+)/i]
  ];

  for (const [label, regex] of rules) {
    const m = t.match(regex);
    if (m && m[1]) out[label] = clean(m[1]);
  }

  return out;
}

function inferSport(text) {
  if (/游泳|划水|泳姿|泳池|游泳趟數|swim|pool length/i.test(text)) return "游泳";
  if (/跑步|步頻|平均配速|running|running dynamics/i.test(text)) return "跑步";
  if (/自行車|單車|騎乘|踏頻|平均功率|cycling|bike|normalized power/i.test(text)) return "自行車";
  return "未判定";
}

$("recognize").addEventListener("click", async () => {
  if (!records.length) return alert("請先上傳圖片。");
  if (!window.Tesseract) {
    $("status").textContent = "OCR 程式載入失敗，請檢查網路後重新整理。";
    return;
  }

  $("recognize").disabled = true;
  try {
    for (let i = 0; i < records.length; i++) {
      const r = records[i];
      r.status = `辨識中 ${i + 1}/${records.length}`;
      render();
      $("status").textContent = `正在辨識第 ${i + 1} 張圖片……`;

      try {
        const result = await Tesseract.recognize(r.file, "chi_tra+eng");
        r.text = result.data.text.trim();
        r.metrics = extract(r.text);
        r.status = Object.keys(r.metrics).length
          ? "已擷取重點，請核對"
          : "未找到明確欄位，請檢查原圖或手動輸入";
      } catch (err) {
        r.status = "辨識失敗";
      }
      render();
    }
    $("status").textContent = "辨識完成。請核對數據後產生報告。";
  } finally {
    $("recognize").disabled = false;
  }
});

function generateReport() {
  if (!records.length) return "請先上傳圖片。";

  const allText = records.map(r => r.text).join("\n");
  const selected = $("sport").value;
  const sport = selected === "自動判斷" ? inferSport(allText) : selected;

  // 只合併有辨識到的重點欄位，不輸出整段 OCR 原文。
  const merged = {};
  records.forEach(r => {
    const current = extract(r.text);
    Object.entries(current).forEach(([key, value]) => {
      if (!merged[key]) merged[key] = [];
      if (!merged[key].includes(value)) merged[key].push(value);
    });
  });

  const fieldOrder = [
    "日期", "距離", "時間", "爬升", "平均心率", "最高心率",
    "平均功率", "標準化功率", "平均速度", "平均配速",
    "平均踏頻", "步頻", "卡路里", "泳池長度", "游泳趟數"
  ];

  const lines = [
    "# Garmin 訓練紀錄",
    `運動類型：${sport}`,
    `截圖數量：${records.length}`
  ];

  if ($("note").value.trim()) lines.push(`訓練備註：${$("note").value.trim()}`);

  let found = false;
  fieldOrder.forEach(key => {
    if (merged[key] && merged[key].length) {
      found = true;
      lines.push(`${key}：${merged[key].join(" / ")}`);
    }
  });

  if (!found) {
    lines.push("未能可靠擷取訓練數據，請手動補上距離、時間及其他重點。");
  }

  lines.push(
    "",
    "請協助分析這次訓練：",
    "1. 評估訓練強度與主要訓練效果。",
    "2. 若有足夠數據，分析配速、心率或功率表現。",
    "3. 提出下一次訓練的具體建議。",
    "注意：同一欄位若出現多個數值，代表截圖中辨識到不同值，請勿直接相加；需要先核對原始截圖。"
  );

  return lines.join("\n");
}

$("generate").addEventListener("click", () => {
  $("report").textContent = generateReport();
});

$("copy").addEventListener("click", async () => {
  const text = $("report").textContent;
  try {
    await navigator.clipboard.writeText(text);
    $("status").textContent = "報告已複製。";
  } catch (e) {
    $("status").textContent = "請選取報告文字後手動複製。";
  }
});

$("clear").addEventListener("click", () => {
  if (!confirm("確定清空所有圖片？")) return;
  records.forEach(r => URL.revokeObjectURL(r.url));
  records = [];
  $("report").textContent = "尚未產生報告。";
  $("status").textContent = "已清空。";
  render();
});

render();
</script>
</body>
</html>
